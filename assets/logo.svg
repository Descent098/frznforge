<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    frznforge mark (0.2.0): the frozen anvil with flames, simplified from the original
    illustration. Three shapes only — a flame in the site's ember→ice brand gradient, the
    anvil silhouette in forge-dark navy, and icicles hanging from the face. This file is
    the master: after editing it, regenerate public/logo.png and public/favicon.ico with
    `npx tsx scripts/render-logo.ts`. The white sidebar variant lives as `#i-anvil` in
    src/components/IconSprite.astro.
  -->
  <defs>
    <linearGradient id="forge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a2f"/>
      <stop offset=".45" stop-color="#e2571f"/>
      <stop offset="1" stop-color="#6dbaf1"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe7f8"/>
      <stop offset="1" stop-color="#6dbaf1"/>
    </linearGradient>
  </defs>

  <!-- flame: two licks, rising off the anvil face -->
  <path fill="url(#forge)" d="M63 6
    C64 16 55 22 52 30
    C49 38 52 46 58 50
    C56 44 58 40 61 37
    C61 44 68 45 68 52
    C74 49 78 43 78 36
    C78 28 70 24 69 14
    C74 18 79 23 81 30
    C83 24 80 16 74 11
    C70 8 66 7 63 6 Z"/>

  <!-- anvil: face + horn, waist, base. The ice-blue rim is what keeps the mark legible on
       dark surfaces (a navy silhouette alone disappears on a dark browser tab) — and it is
       the "frozen" in frznforge: the anvil's edges are iced over. -->
  <path fill="#16202e" stroke="#6dbaf1" stroke-width="3" stroke-linejoin="round" d="M12 54
    L88 54
    C102 54 112 57 120 63
    C110 70 100 72 88 72
    L82 72
    C80 80 80 86 84 94
    L92 100
    L92 112
    L36 112
    L36 100
    L44 94
    C48 86 48 80 46 72
    L12 72
    Z"/>

  <!-- icicles under the face lip -->
  <path fill="url(#ice)" d="M22 72 L27 88 L32 72 Z"/>
  <path fill="url(#ice)" d="M52 72 L57 92 L62 72 Z"/>
  <path fill="url(#ice)" d="M68 72 L72 84 L76 72 Z"/>
</svg>
